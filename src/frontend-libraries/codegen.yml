    plugins:
      - "typescript-operations"
      - "typescript-apollo-angular"
    config:
      typesSuffix: Dto
      importSchemaTypesFrom: 'projects/meshmakers/octo-services/src/lib/graphQL/globalTypes'
      scalars:
        BigInt: any
        Byte: any
        CkVersion: any
        DateTime: any
        DateTimeOffset: any
        Decimal: any
        LargeBinary: any
        Long: any
        OctoObjectId: any
        RtCkAssociationRoleId: any
        RtCkEnumId: any
        RtCkRecordId: any
        RtCkTypeId: any
        Seconds: any
        SimpleScalar: any
        ULong: any
        Uri: any


