overwrite: true
hooks:
  afterAllFileWrite:
    - node scripts/codegen-strip-incremental.mjs
schema:
  - schema.graphql
generates:
  # demo-app (uses types from @meshmakers/octo-services)
  projects/demo-app/src/app/graphQL/:
    documents: "projects/demo-app/src/app/graphQL/*.graphql"
    preset: near-operation-file
    presetConfig:
      extension: .ts
    plugins:
      - "typescript-operations"
      - "typescript-apollo-angular"
    config:
      typesSuffix: Dto
      importSchemaTypesFrom: '~@meshmakers/octo-services'
      scalars:
        BigInt: any
        Byte: any
        CkVersion: any
        DateTime: any
        DateTimeOffset: any
        Decimal: any
        LargeBinary: any
        Long: any
        OctoObjectId: any
        RtCkAssociationRoleId: any
        RtCkEnumId: any
        RtCkRecordId: any
        RtCkTypeId: any
        Seconds: any
        SimpleScalar: any
        ULong: any
        Uri: any


  # octo-meshboard (uses types from @meshmakers/octo-services)
  projects/meshmakers/octo-meshboard/src/lib/graphQL/:
    documents: "projects/meshmakers/octo-meshboard/src/lib/graphQL/*.graphql"
    preset: near-operation-file
