        RtCkAssociationRoleId: any
        RtCkEnumId: any
        RtCkRecordId: any
        RtCkTypeId: any
        Seconds: any
        SimpleScalar: any
        ULong: any
        Uri: any


  # octo-services
  projects/meshmakers/octo-services/src/lib/graphQL/globalTypes.ts:
    documents: "projects/meshmakers/octo-services/src/lib/graphQL/*.graphql"
    plugins:
      - typescript
    config:
      typesSuffix: Dto
      enumPrefix: false
      scalars:
        DateTime: Date
        Decimal: number
        OctoObjectId: string
        CkAttributeId: string
        CkEnumId: string
        CkRecordId: string
        CkTypeId: string
        BigInt: any
        Byte: any
        CkVersion: any
        DateTimeOffset: any
        LargeBinary: any
        Long: any
        RtCkAssociationRoleId: any
        RtCkEnumId: any
        RtCkRecordId: any
        RtCkTypeId: any
        Seconds: any
        SimpleScalar: any
        ULong: any
        Uri: any
  projects/meshmakers/octo-services/src/lib/graphQL/possibleTypes.ts:
    plugins:
      - fragment-matcher
    config:
      apolloClientVersion: 3
      useExplicitTyping: true
  projects/meshmakers/octo-services/src/lib/graphQL/:
    documents: "projects/meshmakers/octo-services/src/lib/graphQL/*.graphql"
    preset: near-operation-file
    presetConfig:
