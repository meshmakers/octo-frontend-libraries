# CK attribute catalogue of one runtime type (by RtCkTypeId, the format of RtEntity.ckTypeId)
# for SecretSafeAttributeNamesService (AB#5542): names, value types, the `secret` metadata
# marker and the record type of RECORD / RECORD_ARRAY attributes. Construction-kit metadata
# only — no runtime values.
query getSecretSafeTypeAttributes($rtCkTypeId: String!) {
  constructionKit {
    types(rtCkId: $rtCkTypeId, first: 1) {
      items {
        attributes {
          items {
            attributeName
            attributeValueType
            isOptional
            attribute {
              metaData {
                key
                value
              }
              ckRecord {
                ckRecordId {
                  fullName
                }
              }
            }
          }
        }
      }
    }
  }
}
