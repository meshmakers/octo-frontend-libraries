query getOrphanCandidates(
  $ckTypeId: String!
  $mapsFromRoleId: String!
  $mappingCkTypeId: String!
  $first: Int
  $after: String
  $searchFilter: SearchFilter
) {
  runtime {
    runtimeEntities(
      ckId: $ckTypeId
      first: $first
      after: $after
      searchFilter: $searchFilter
    ) {
      totalCount
      items {
        rtId
        ckTypeId
        rtWellKnownName
        attributes(attributeNames: ["name", "description"]) {
          items {
            attributeName
            value
          }
        }
        # Counts inbound MapsFrom associations from any DataPointMapping. An
        # entity is "orphan" (= unmapped) when totalCount === 0.
        # NOTE: `first: 1` (not 0) — MongoDB's $slice rejects 0 as page size.
        # We only read totalCount, so loading a single item per row is fine.
        associations {
          mappings: targets(
            roleId: $mapsFromRoleId
            ckId: $mappingCkTypeId
            direction: INBOUND
            first: 1
          ) {
            totalCount
          }
        }
      }
    }
  }
}
