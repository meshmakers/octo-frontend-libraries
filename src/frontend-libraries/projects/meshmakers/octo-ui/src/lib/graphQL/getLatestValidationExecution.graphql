# SECRET-safe (AB#5542): explicit attribute list — only the execution result is read.
query getLatestValidationExecution(
  $pipelineRtId: OctoObjectId!
  $pipelineCkTypeId: String!
  $executesRoleId: String!
  $executionCkTypeId: String!
) {
  runtime {
    runtimeEntities(rtId: $pipelineRtId, ckId: $pipelineCkTypeId) {
      items {
        rtId
        ckTypeId
        associations {
          executions: targets(
            roleId: $executesRoleId
            ckId: $executionCkTypeId
            direction: INBOUND
            first: 1
            sortOrder: [{ attributePath: "CompletedAt", sortOrder: DESCENDING }]
          ) {
            items {
              rtId
              ckTypeId
              attributes(attributeNames: ["outputData", "completedAt"], resolveEnumValuesToNames: true) {
                items {
                  attributeName
                  value
                }
              }
            }
          }
        }
      }
    }
  }
}
