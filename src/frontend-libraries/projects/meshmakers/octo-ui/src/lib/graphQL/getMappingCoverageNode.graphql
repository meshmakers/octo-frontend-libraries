query getMappingCoverageNode(
  $rtId: OctoObjectId!
  $ckTypeId: String!
  $childRoleId: String!
  $childCkTypeId: String!
  $childDirection: GraphDirection!
  $grandChildRoleId: String!
  $grandChildCkTypeId: String!
  $grandChildDirection: GraphDirection!
  $mappingRoleId: String!
  $mappingCkTypeId: String!
) {
  runtime {
    runtimeEntities(rtId: $rtId, ckId: $ckTypeId) {
      items {
        rtId
        ckTypeId
        rtWellKnownName
        attributes(attributeNames: ["name", "description"]) {
          items {
            attributeName
            value
          }
        }
        associations {
          ownMappings: targets(
            roleId: $mappingRoleId
            ckId: $mappingCkTypeId
            direction: INBOUND
          ) {
            totalCount
          }
          # Child navigation is variable: the spatial hierarchy uses
          # System/ParentChild INBOUND on every level, while a `Type`
          # perspective root (e.g. DistributionSystem) navigates its
          # primaryRoleId (e.g. SystemMembers), possibly OUTBOUND.
          children: targets(
            roleId: $childRoleId
            ckId: $childCkTypeId
            direction: $childDirection
          ) {
            totalCount
            items {
              rtId
              ckTypeId
              attributes(attributeNames: ["name", "description"]) {
                items {
                  attributeName
                  value
                }
              }
              associations {
                # Grandchildren get their own navigation variables because the
                # perspective's primary role applies to the ROOT level only —
                # below a perspective root the tree continues with the spatial
                # hierarchy (whitelist-at-root-only, mirrors the runtime
                # browser's AB#4263 behaviour).
                grandChildren: targets(
                  roleId: $grandChildRoleId
                  ckId: $grandChildCkTypeId
                  direction: $grandChildDirection
                ) {
                  totalCount
                }
                mappings: targets(
                  roleId: $mappingRoleId
                  ckId: $mappingCkTypeId
                  direction: INBOUND
                ) {
                  totalCount
                }
              }
            }
          }
        }
      }
    }
  }
}
