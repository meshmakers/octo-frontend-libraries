# Candidate targets for a reference field. Selects only the non-secret `name` attribute (secret-safe picker).
query entityFormGetReferenceOptions(
  $ckTypeId: String!
  $first: Int
  $after: String
  $searchFilter: SearchFilter
  $fieldFilters: [FieldFilter]
  $sort: [Sort]
) {
  runtime {
    runtimeEntities(
      ckId: $ckTypeId
      first: $first
      after: $after
      searchFilter: $searchFilter
      fieldFilter: $fieldFilters
      sortOrder: $sort
    ) {
      totalCount
      pageInfo {
        endCursor
        hasNextPage
      }
      items {
        rtId
        ckTypeId
        rtWellKnownName
        rtDisplayName
        # The target's name as its label (AB#5547 visual check #9: a pool showed its
        # well-known name "CommunicationPool" instead of "Default Cloud"). Explicit list
        # with the one non-secret attribute; never omit attributeNames.
        attributes(attributeNames: ["name"]) {
          items {
            attributeName
            value
          }
        }
        rtDisplayDescription
      }
    }
  }
}
