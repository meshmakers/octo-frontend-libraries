# Generic runtime selection — SECRET-safe (AB#5542): `$attributeNames` is required and
# non-nullable — `[]` for rt* fields only, a fixed camelCase list, or
# `SecretSafeAttributeNamesService.forCkType()` (octo-ui) for "all non-secret attributes".
query getEntitiesByCkType(
  $ckTypeId: String!
  $attributeNames: [String!]!
  $rtId: OctoObjectId
  $after: String
  $first: Int
  $searchFilter: SearchFilter
  $fieldFilters: [FieldFilter]
  $sort: [Sort]
) {
  runtime {
    runtimeEntities(
      ckId: $ckTypeId
      rtId: $rtId
      after: $after
      first: $first
      searchFilter: $searchFilter
      fieldFilter: $fieldFilters
      sortOrder: $sort
    ) {
      totalCount
      items {
        rtId
        ckTypeId
        rtWellKnownName
        rtDisplayName
        rtDisplayDescription
        rtCreationDateTime
        rtChangedDateTime
        attributes(attributeNames: $attributeNames, resolveEnumValuesToNames: true) {
          items {
            attributeName
            value
          }
        }
      }
    }
  }
}
