# Generic runtime selection — SECRET-safe (AB#5542): `$attributeNames` is required and
# non-nullable — `[]` for rt* fields only, a fixed camelCase list, or
# `SecretSafeAttributeNamesService.forCkType()` (octo-ui) for "all non-secret attributes".
query getDashboardEntity($rtId: OctoObjectId!, $ckTypeId: String!, $attributeNames: [String!]!) {
  runtime {
    runtimeEntities(rtId: $rtId, ckId: $ckTypeId, first: 1) {
      items {
        rtId
        ckTypeId
        rtWellKnownName
        rtDisplayName
        rtCreationDateTime
        rtChangedDateTime
        attributes(attributeNames: $attributeNames, resolveEnumValuesToNames: true) {
          items {
            attributeName
            value
          }
        }
        associations {
          definitions(direction: ANY) {
            totalCount
            items {
              targetRtId
              targetCkTypeId
              originRtId
              originCkTypeId
              ckAssociationRoleId
            }
          }
        }
      }
    }
  }
}
