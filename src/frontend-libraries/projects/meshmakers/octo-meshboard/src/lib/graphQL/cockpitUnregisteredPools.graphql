# Cockpit widgets (AB#5558): deployment sites (System.Communication 4.x,
# formerly "pools") no Communication Operator has registered for. Adapters and
# applications hosted by such a site are never rolled out. File and operation
# name keep "Pools" so the generated identifiers stay stable (AB#5842).
query cockpitUnregisteredPools($first: Int) {
  runtime {
    systemCommunicationDeploymentSite(
      first: $first
      fieldFilter: [{ attributePath: "communicationState", operator: EQUALS, comparisonValue: "UNREGISTERED" }]
      sortOrder: [{ attributePath: "name", sortOrder: ASCENDING }]
    ) {
      totalCount
      items {
        rtId
        name
      }
    }
  }
}
