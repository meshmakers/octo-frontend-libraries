# Cockpit widgets (AB#5558): pipeline executions of the last 24 h, reached the
# same way as the Refinery Studio's Data Flows list: data flow -> child
# pipelines -> folded statistics (AB#4370) plus the latest execution, which is
# counted in when it is newer than the statistics (countPipelineExecutions);
# lastUpdatedAt anchors the hourly bars and the latest-execution check (AB#5583).
query cockpitDataFlowExecutions($first: Int) {
  runtime {
    systemCommunicationDataFlow(first: $first) {
      totalCount
      items {
        rtId
        children(ckTypeIds: ["System.Communication/Pipeline"]) {
          items {
            ... on SystemCommunicationPipeline {
              rtId
              statisticsForPipeline(
                ckTypeIds: ["System.Communication/PipelineStatistics"]
                first: 1
              ) {
                items {
                  ... on SystemCommunicationPipelineStatistics {
                    lastExecutionAt
                    lastUpdatedAt
                    lastHourSuccessCount
                    lastHourFailureCount
                    last24HoursSuccessCount
                    last24HoursFailureCount
                    hourlyBuckets {
                      hourStartAt
                      successCount
                      failureCount
                    }
                  }
                }
              }
              executedPipeline(
                ckTypeIds: ["System.Communication/PipelineExecution"]
                first: 1
                sortOrder: [{ attributePath: "startedAt", sortOrder: DESCENDING }]
              ) {
                items {
                  ... on SystemCommunicationPipelineExecution {
                    startedAt
                    status
                  }
                }
              }
            }
          }
        }
      }
    }
  }
}
