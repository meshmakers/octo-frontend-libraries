# AB#8864: CK method System.Identity/User.ResetPassword-1 on one user. The password travels only in $input.
# Called with fetchPolicy 'no-cache' so the Apollo cache never stores the arguments.
mutation identityUserResetPassword($rtId: OctoObjectId!, $input: SystemIdentityUserResetPasswordMethodInput!) {
  runtime {
    systemIdentityUsers {
      resetPassword(rtId: $rtId, input: $input) {
        invocationId
      }
    }
  }
}
