# AB#8863: CK method System.Identity/User.SetRoles-1 on one user (the target, by rtId); $input carries the complete list of direct role names.
# Replaces the deprecated REST endpoint (AB#8415); called with fetchPolicy 'no-cache' and errorPolicy 'none'.
mutation identityUserSetRoles($rtId: OctoObjectId!, $input: SystemIdentityUserSetRolesMethodInput!) {
  runtime {
    systemIdentityUsers {
      setRoles(rtId: $rtId, input: $input) {
        invocationId
      }
    }
  }
}
