# AB#8863: CK method System.Identity/User.AddRole-1 on one user (the target, by rtId); $input carries one direct role.
# Replaces the deprecated REST endpoint (AB#8415); called with fetchPolicy 'no-cache' and errorPolicy 'none'.
mutation identityUserAddRole($rtId: OctoObjectId!, $input: SystemIdentityUserAddRoleMethodInput!) {
  runtime {
    systemIdentityUsers {
      addRole(rtId: $rtId, input: $input) {
        invocationId
      }
    }
  }
}
