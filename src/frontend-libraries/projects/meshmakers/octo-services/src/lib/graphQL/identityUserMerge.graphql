# AB#8863: CK method System.Identity/User.Merge-1 on one user (the target, by rtId); $input carries the source user name.
# Replaces the deprecated REST endpoint (AB#8415); called with fetchPolicy 'no-cache' and errorPolicy 'none'.
mutation identityUserMerge($rtId: OctoObjectId!, $input: SystemIdentityUserMergeMethodInput!) {
  runtime {
    systemIdentityUsers {
      merge(rtId: $rtId, input: $input) {
        invocationId
      }
    }
  }
}
