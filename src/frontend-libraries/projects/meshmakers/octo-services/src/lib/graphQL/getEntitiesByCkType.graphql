# Generic runtime selection — SECRET-safe (AB#5542): `$attributeNames` is required and
# non-nullable. Pass `[]` when only the rt* system fields are needed, otherwise an explicit
# camelCase list (see `toAttributeNameFilter`). Omitting the argument would return EVERY
# attribute, passwords and client secrets included.
query getEntitiesByCkType(
  $ckTypeId: String!
  $attributeNames: [String!]!
  $rtId: OctoObjectId
  $after: String
  $first: Int
  $searchFilter: SearchFilter
  $fieldFilters: [FieldFilter]
  $sort: [Sort]
) {
  runtime {
    runtimeEntities(
      ckId: $ckTypeId
      rtId: $rtId
      after: $after
      first: $first
      searchFilter: $searchFilter
      fieldFilter: $fieldFilters
      sortOrder: $sort
    ) {
      totalCount
      items {
        rtId
        ckTypeId
        rtWellKnownName
        rtDisplayName
        rtDisplayDescription
        rtCreationDateTime
        rtChangedDateTime
        attributes(attributeNames: $attributeNames, resolveEnumValuesToNames: true) {
          items {
            attributeName
            value
          }
        }
      }
    }
  }
}
