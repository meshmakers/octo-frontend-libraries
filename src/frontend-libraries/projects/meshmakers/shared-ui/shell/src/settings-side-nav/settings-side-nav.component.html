<nav class="side-nav" [attr.aria-label]="navLabel()">
  <button type="button"
          class="side-nav__item"
          data-side-nav="home"
          [attr.aria-current]="homeActive() ? 'page' : null"
          (click)="homeSelected.emit()">
    <span>{{ homeLabel() }}</span>
  </button>
  @for (section of sections(); track section.id) {
    @if (section.label) {
      <div class="side-nav__group" role="group" [attr.data-group]="section.id" [attr.aria-labelledby]="groupHeadingId(section)">
        <span class="side-nav__group-label" [id]="groupHeadingId(section)">{{ section.label }}</span>
        @for (category of section.categories; track category.id) {
          <ng-container *ngTemplateOutlet="item; context: { $implicit: category }"></ng-container>
        }
      </div>
    } @else {
      @for (category of section.categories; track category.id) {
        <ng-container *ngTemplateOutlet="item; context: { $implicit: category }"></ng-container>
      }
    }
  }
</nav>

<ng-template #item let-category>
  <button type="button"
          class="side-nav__item"
          [attr.data-tab-id]="category.id"
          [attr.aria-current]="!homeActive() && category.id === activeTabId() ? 'page' : null"
          [title]="category.tooltip ?? ''"
          (click)="tabSelected.emit(category)">
    <span>{{ category.text }}</span>
    @if (badges()[category.id]; as badge) {
      <span class="side-nav__count"
            [class.is-attention]="badge.attention"
            [attr.data-badge]="category.id"
            [attr.aria-label]="badge.label ?? null">{{ badge.count }}</span>
    }
  </button>
</ng-template>
