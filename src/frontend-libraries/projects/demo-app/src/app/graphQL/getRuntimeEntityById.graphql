# SECRET-safe (AB#5542): explicit, non-nullable attribute list (see SecretSafeAttributeNamesService).
query getRuntimeEntityById($ckTypeId: String!, $attributeNames: [String!]!) {
  runtime {
    runtimeEntities(ckId: $ckTypeId, first: 1) {
      items {
        rtId
        ckTypeId
        rtWellKnownName
        rtCreationDateTime
        rtChangedDateTime
        attributes(attributeNames: $attributeNames, resolveEnumValuesToNames: true) {
          items {
            attributeName
            value
          }
        },
        associations {
          definitions(direction: ANY){
            totalCount
            items {
              targetRtId
              targetCkTypeId
              originRtId
              originCkTypeId
              ckAssociationRoleId
            }
          }
        }
      }
    }
  }
}
