# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
# Please see the documentation for all configuration options:
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  - package-ecosystem: "nuget" # See documentation for possible values
    directory: "/src/**/*" # Location of package manifests
    schedule:
      interval: "weekly"
  - package-ecosystem: "npm" # See documentation for possible values
    directories:
      - "/src/frontend-libraries"
    schedule:
      interval: "weekly"
    versioning-strategy: increase
  # Dockerfile and Dockerfile.prebuilt both live in /src/frontend-libraries.
  - package-ecosystem: "docker"
    directory: "/src/frontend-libraries"
    schedule:
      interval: "weekly"
    ignore:
      # The meshmakers platform images are bumped deliberately together with the
      # platform toolchain. Dependabot misreads their legacy tag scheme
      # (`8.0-<date>` sorts above `1.3.0.0`), so it must not propose them at all.
      - dependency-name: "meshmakers/*"
      # nginx: patch and minor updates are welcome, a major is a deliberate move.
      - dependency-name: "nginx"
        update-types: ["version-update:semver-major"]
